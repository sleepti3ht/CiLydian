[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cilydian"
version = "0.1.1"
description = "Self-hosted agentic CI pipeline with spec-driven codegen"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "sleepti3ht", email = "sleepti3ht@gmail.com"}
]
dependencies = [
    "langgraph>=1.0",
    "langchain-ollama>=1.0",
    "langchain-openai>=1.0",
]

[project.scripts]
cilydian = "pipeline:main"

[project.urls]
Homepage = "https://github.com/sleepti3ht/CiLydian"
Repository = "https://github.com/sleepti3ht/CiLydian"

[tool.setuptools]
py-modules = ["pipeline"]