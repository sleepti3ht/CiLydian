      spec: |
        ### MINIMAL SPEC

        #### Role
        Sliding-window rate limiter

        #### Interface
        ```python
        class SlidingWindowRateLimiter:
            def __init__(self, max_requests: int, window_size: float, clock: Callable[[], float] = time.monotonic):
                """
                Initialize the sliding window rate limiter.

                :param max_requests: Maximum number of requests allowed within the window.
                :param window_size: Size of the sliding window in seconds.
                :param clock: A callable that returns the current time. Defaults to time.monotonic.
                """
                self.max_requests = max_requests
                self.window_size = window_size
                self.clock = clock
                self.requests = []

            def allow_request(self) -> bool:
                """
                Check if a request is allowed based on the sliding window rate limit.

                :return: True if the request is allowed, False otherwise.
                """
                current_time = self.clock()
                self.requests = [req for req in self.requests if current_time - req < self.window_size]
                if len(self.requests) < self.max_requests:
                    self.requests.append(current_time)
                    return True
                return False
        ```

        #### Constraints
        1. The rate limiter should allow a maximum of `max_requests` requests within a sliding window of `window_size` seconds.
        2. The implementation must use the provided `clock` function to get the current time.
        3. The `allow_request` method should return `True` if the request is allowed and `False` otherwise.

        #### Measurable Acceptance Criteria
        1. The rate limiter should allow up to `max_requests` requests within the `window_size` seconds.
        2. The rate limiter should deny requests after `max_requests` have been made within the `window_size` seconds.
        3. The rate limiter should allow requests after the `window_size` has elapsed since the last request.
        4. The rate limiter should handle concurrent requests correctly.
        5. The rate limiter should not allow more than `max_requests` requests in a shorter period than `window_size`.

        #### Test Plan
        1. **Test Case 1**: Allow up to `max_requests` requests within the `window_size` seconds.
           - **Input**: `max_requests=5`, `window_size=10`, `allow_request()` called 5 times within 10 seconds.
           - **Expected Output**: All 5 calls should return `True`.

        2. **Test Case 2**: Deny requests after `max_requests` have been made within the `window_size` seconds.
           - **Input**: `max_requests=5`, `window_size=10`, `allow_request()` called 6 times within 10 seconds.
           - **Expected Output**: The 6th call should return `False`.

        3. **Test Case 3**: Allow requests after the `window_size` has elapsed since the last request.
           - **Input**: `max_requests=5`, `window_size=10`, `allow_request()` called 5 times within 10 seconds, then called again after 15 seconds.
           - **Expected Output**: The call after 15 seconds should return `True`.

        4. **Test Case 4**: Handle concurrent requests correctly.
           - **Input**: `max_requests=5`, `window_size=10`, `allow_request()` called concurrently from multiple threads.
           - **Expected Output**: All concurrent calls should return `True` if the total number of calls does not exceed `max_requests` within the `window_size`.

        5. **Test Case 5**: Allow more than `max_requests` requests in a shorter period than `window_size`.
           - **Input**: `max_requests=5`, `window_size=10`, `allow_request()` called 5 times within 5 seconds.
           - **Expected Output**: All 5 calls should return `True`.
