        #### Role
        Develop a Least Recently Used (LRU) cache with Time-To-Live (TTL) functionality.

        #### Interface
        ```python
        from typing import Any, Callable, Dict, Optional

        class LRUCacheWithTTL:
            def __init__(self, capacity: int, ttl: float, clock: Callable[[], float] = time.monotonic):
                """
                Initialize the LRU cache with a given capacity and TTL.

                :param capacity: Maximum number of items the cache can hold.
                :param ttl: Time-To-Live in seconds for each item.
                :param clock: A callable that returns the current time. Defaults to time.monotonic.
                """
                pass

            def get(self, key: Any) -> Optional[Any]:
                """
                Retrieve an item from the cache by key.

                :param key: The key of the item to retrieve.
                :return: The value associated with the key if it exists and is not expired; otherwise, None.
                """
                pass

            def set(self, key: Any, value: Any) -> None:
                """
                Set an item in the cache with a given key and value.

                :param key: The key of the item to set.
                :param value: The value to store in the cache.
                """
                pass

            def delete(self, key: Any) -> None:
                """
                Delete an item from the cache by key.

                :param key: The key of the item to delete.
                """
                pass

            def clear(self) -> None:
                """
                Clear all items from the cache.
                """
                pass
        ```

        #### Constraints
        1. The cache must support setting, getting, deleting, and clearing items.
        2. Each item in the cache must have a TTL.
        3. The cache must evict items based on both LRU and TTL policies.
        4. The cache must be thread-safe.
        5. The cache must not use any external libraries for its core functionality.

        #### Measurable Acceptance Criteria
        1. The cache must correctly evict items based on TTL.
        2. The cache must correctly evict items based on LRU.
        3. The cache must handle concurrent access without data corruption.
        4. The cache must correctly handle setting and getting items.
        5. The cache must correctly handle deleting and clearing items.

        #### Test Plan
        1. **Test TTL Eviction**:
           - Set an item with a TTL.
           - Wait for the TTL to expire.
           - Verify that the item is evicted from the cache.

        2. **Test LRU Eviction**:
           - Set multiple items in the cache.
           - Retrieve the first item.
           - Set another item, causing the least recently used item to be evicted.
           - Verify that the least recently used item is evicted.

        3. **Test Concurrent Access**:
           - Set multiple items in the cache from multiple threads.
           - Retrieve and delete items from multiple threads.
           - Verify that the cache handles concurrent access without data corruption.

        4. **Test Setting and Getting Items**:
           - Set an item in the cache.
           - Retrieve the item from the cache.
           - Verify that the retrieved item matches the set item.

        5. **Test Deleting and Clearing Items**:
           - Set multiple items in the cache.
           - Delete an item from the cache.
           - Clear the cache.
           - Verify that the deleted and cleared items are no longer in the cache.
      code: |
        from typing import Any, Callable, Dict, Optional
        from collections import OrderedDict
        import time
        from threading import Lock

        class LRUCacheWithTTL:
            def __init__(self, capacity: int, ttl: float, clock: Callable[[], float] = time.monotonic):
                self.capacity = capacity
                self.ttl = ttl
                self.clock = clock
                self.cache = OrderedDict()
                self.lock = Lock()

            def get(self, key: Any) -> Optional[Any]:
                with self.lock:
                    if key not in self.cache:
                        return None
                    value, expire_time = self.cache[key]
                    if self.clock() > expire_time:
                        del self.cache[key]
                        return None
                    self.cache.move_to_end(key)
                    return value

            def set(self, key: Any, value: Any) -> None:
                with self.lock:
                    expire_time = self.clock() + self.ttl
                    if key in self.cache:
                        self.cache.move_to_end(key)
                    self.cache[key] = (value, expire_time)
                    if len(self.cache) > self.capacity:
                        self.cache.popitem(last=False)

            def delete(self, key: Any) -> None:
                with self.lock:
                    if key in self.cache:
                        del self.cache[key]

            def clear(self) -> None:
                with self.lock:
                    self.cache.clear()
